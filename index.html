
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Alle links op één plek.">

  <title>Mijn links</title>
  <link rel="stylesheet" href="styles.css">

  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <div class="background-effects" aria-hidden="true">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
  </div>

  <main class="page-shell">
    <section class="profile-card" aria-label="Mijn profiel">
      <header class="profile-header">
        <div class="avatar-wrap">
          <img
            id="avatar"
            class="avatar"
            src="assets/avatar.webp"
            alt="Profielfoto"
            width="104"
            height="104"
          >
          <span id="verified" class="verified" hidden
            aria-label="Geverifieerd">✓</span>
        </div>

        <h1 id="profile-name">Jouw Naam</h1>
        <p id="profile-username" class="username"></p>
        <p id="profile-bio" class="profile-bio"></p>
      </header>

      <nav id="links" class="links-list" aria-label="Mijn links">
        <p class="loading">Links laden...</p>
      </nav>

      <footer id="page-footer" class="page-footer">
        <span id="footer-text"></span>
      </footer>
    </section>

    <noscript>
      <p class="noscript-message">
        Schakel JavaScript in om deze pagina te gebruiken.
      </p>
    </noscript>
  </main>
</body>
</html>
